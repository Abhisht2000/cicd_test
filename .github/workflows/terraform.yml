name: terraform

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev:
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform init -backend-config="key=dev.tfstate" #create a dev env statefile
      - run: terraform apply -auto-approve -var-file=envs/dev.tfvars
      - run: terraform destroy -auto-approve -var-file=envs/dev.tfvars #destroy the dev env after apply
      

  staging:
    needs: dev
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform init -backend-config="key=staging.tfstate"
      - run: terraform apply -auto-approve -var-file=envs/staging.tfvars
      - run: terraform apply -auto-approve -var-file=envs/staging.tfvars
      - run: terraform destroy -auto-approve -var-file=envs/staging.tfvars #destroy the staging env after apply


  prod:
    needs: staging
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform init -backend-config="key=prod.tfstate"
      - run: terraform apply -auto-approve -var-file=envs/prod.tfvars
      - run: terraform destroy -auto-approve -var-file=envs/prod.tfvars #destroy the prod env after apply